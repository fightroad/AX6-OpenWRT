name: AX6-IPQ Config

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 进入 menuconfig（通过你自己的 FRP 服务）'
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  CONFIG_FILE: AX6-IPQ/.config
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai

jobs:
  config:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update -y
          sudo apt-get -qq install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils-extra \
            python3-setuptools rsync swig unzip zlib1g-dev file wget patch subversion
          sudo timedatectl set-timezone "$TZ"

      - name: Prepare OpenWrt
        run: |
          git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          [ -e "$GITHUB_WORKSPACE/$FILES" ] && cp -a "$GITHUB_WORKSPACE/$FILES" files
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          chmod +x "$GITHUB_WORKSPACE/$DIY_SH"
          "$GITHUB_WORKSPACE/$DIY_SH"
          make defconfig

      - name: SSH menuconfig via FRP
        if: inputs.ssh
        timeout-minutes: 120
        env:
          FRP_SERVER_ADDR: ${{ secrets.FRP_SERVER_ADDR }}
          FRP_SERVER_PORT: ${{ secrets.FRP_SERVER_PORT }}
          FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
          FRP_REMOTE_PORT: ${{ secrets.FRP_REMOTE_PORT }}
        run: |
          set -euo pipefail

          for v in FRP_SERVER_ADDR FRP_SERVER_PORT FRP_TOKEN FRP_REMOTE_PORT; do
            if [ -z "${!v:-}" ]; then
              echo "::error::缺少 Secret: $v"
              exit 1
            fi
          done

          SSH_PASSWORD=$(openssl rand -hex 16)

          sudo apt-get -qq install -y openssh-server
          echo "runner:${SSH_PASSWORD}" | sudo chpasswd
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo service ssh restart

          FRPC_VER=0.61.1
          curl -fsSL "https://github.com/fatedier/frp/releases/download/v${FRPC_VER}/frp_${FRPC_VER}_linux_amd64.tar.gz" \
            | tar xz --strip-components=1 -C /tmp "frp_${FRPC_VER}_linux_amd64/frpc"

          PROXY_NAME="gh-ax6-${{ github.run_id }}"
          {
            echo "serverAddr = \"${FRP_SERVER_ADDR}\""
            echo "serverPort = ${FRP_SERVER_PORT}"
            echo "auth.method = \"token\""
            echo "auth.token = \"${FRP_TOKEN}\""
            echo ""
            echo "[[proxies]]"
            echo "name = \"${PROXY_NAME}\""
            echo "type = \"tcp\""
            echo "localIP = \"127.0.0.1\""
            echo "localPort = 22"
            echo "remotePort = ${FRP_REMOTE_PORT}"
          } > /tmp/frpc.toml

          /tmp/frpc -c /tmp/frpc.toml > /tmp/frpc.log 2>&1 &
          FRPC_PID=$!
          FRPC_OK=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$FRPC_PID" 2>/dev/null; then
              echo "::error::frpc 进程异常退出"
              cat /tmp/frpc.log
              exit 1
            fi
            if grep -q "start proxy success" /tmp/frpc.log; then
              FRPC_OK=1
              break
            fi
            sleep 1
          done
          if [ "$FRPC_OK" -ne 1 ]; then
            echo "::error::frpc 60 秒内未注册成功，请检查 frps/token/端口"
            cat /tmp/frpc.log
            exit 1
          fi
          echo "frpc 已连接，代理 ${PROXY_NAME} 就绪"

          CONTINUE_FILE="$GITHUB_WORKSPACE/continue"
          rm -f "$CONTINUE_FILE"

          echo "=============================================="
          echo "SSH 已就绪，请在本机执行："
          echo "  ssh -p ${FRP_REMOTE_PORT} runner@${FRP_SERVER_ADDR}"
          echo "  密码: ${SSH_PASSWORD}"
          echo ""
          echo "连上后："
          echo "  cd \$GITHUB_WORKSPACE/openwrt && make menuconfig"
          echo "  cd \$GITHUB_WORKSPACE && touch continue"
          echo "=============================================="

          DEADLINE=$(( $(date +%s) + 7200 ))
          while [ ! -f "$CONTINUE_FILE" ]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::等待超时（2 小时），未检测到 touch continue"
              exit 1
            fi
            sleep 10
          done
          echo "已收到 continue，继续导出配置..."

      - name: Export config
        run: cp openwrt/.config "$GITHUB_WORKSPACE/$CONFIG_FILE"

      - name: Upload config
        uses: actions/upload-artifact@v4
        with:
          name: AX6-IPQ-config-${{ github.run_number }}
          path: ${{ env.CONFIG_FILE }}
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### 配置已导出"
            echo ""
            if [ "${{ inputs.ssh }}" = "true" ]; then
              echo "**SSH 模式（FRP）**：在 **SSH menuconfig via FRP** 步骤日志里查看连接命令和随机密码，连上后执行："
              echo "\`\`\`bash"
              echo "cd \$GITHUB_WORKSPACE/openwrt && make menuconfig"
              echo "cd \$GITHUB_WORKSPACE && touch continue"
              echo "\`\`\`"
              echo ""
            else
              echo "已执行 \`make defconfig\` 同步配置（未进 menuconfig）。"
              echo ""
            fi
            echo "1. 下载 **Artifacts** → \`AX6-IPQ-config-*\`"
            echo "2. 覆盖 \`AX6-IPQ/.config\` 并提交"
            echo "3. 运行 **Build OpenWRT for AX6-NSS**"
          } >> "$GITHUB_STEP_SUMMARY"
