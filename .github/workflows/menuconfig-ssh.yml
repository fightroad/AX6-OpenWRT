name: SSH Menuconfig (AX6-IPQ)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'defconfig_only'
        type: choice
        options:
          - defconfig_only
          - ssh_upterm
      sync_defconfig:
        description: '执行 make defconfig 同步配置'
        required: false
        default: true
        type: boolean

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  CONFIG_FILE: AX6-IPQ/.config
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai

jobs:
  menuconfig:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update -y
          sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/2305)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

      - name: Clone source code
        run: git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          [ -e "$FILES" ] && cp -a "$FILES" openwrt/files
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_SH"

      - name: Sync defconfig
        if: inputs.sync_defconfig
        working-directory: ./openwrt
        run: make defconfig

      - name: Print upterm instructions
        if: inputs.mode == 'ssh_upterm'
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### upterm 使用说明（无需注册 upterm 账号）

          1. 看下一步日志里的 **SSH 命令**（形如 `ssh xxx@uptermd.upterm.dev`）
          2. 本机终端执行该命令连入（Windows 可用 PowerShell / Windows Terminal）
          3. 连上后执行：
             ```bash
             cd $GITHUB_WORKSPACE/openwrt
             make menuconfig
             ```
          4. 改完保存退出 menuconfig 后，执行以下命令让 workflow 继续：
             ```bash
             cd $GITHUB_WORKSPACE && touch continue
             ```

          常用路径：Target System → Qualcomm IPQ807x → Redmi AX6 (stock)
          LuCI → Applications → luci-app-passwall
          EOF

      - name: SSH connect via upterm
        if: inputs.mode == 'ssh_upterm'
        uses: owenthereal/action-upterm@v1
        timeout-minutes: 120
        with:
          wait-timeout-minutes: 30

      - name: Sync config back to repo path
        run: |
          if [ -f openwrt/.config ]; then
            cp openwrt/.config AX6-IPQ/.config
            echo "已从 openwrt/.config 同步到 AX6-IPQ/.config"
          else
            echo "::error::未找到 openwrt/.config"
            exit 1
          fi

      - name: Upload updated config
        uses: actions/upload-artifact@v4
        with:
          name: AX6-IPQ-config-${{ github.run_number }}
          path: AX6-IPQ/.config
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### 配置已导出" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.mode }}" = "defconfig_only" ]; then
            echo "- 本次为 **defconfig_only**：已按最新 feeds 同步 .config" >> $GITHUB_STEP_SUMMARY
          fi
          echo "1. 在 **Artifacts** 下载 \`AX6-IPQ-config-*\`" >> $GITHUB_STEP_SUMMARY
          echo "2. 覆盖仓库 \`AX6-IPQ/.config\` 并提交" >> $GITHUB_STEP_SUMMARY
          echo "3. 运行 **Build OpenWRT for AX6-NSS** 云编译" >> $GITHUB_STEP_SUMMARY
