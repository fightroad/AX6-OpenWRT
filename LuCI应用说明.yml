# LuCI 应用说明
# 适用于本仓库 AX6-IPQ/.config（VIKINGYFY/immortalwrt main · redmi_ax6-stock · NSS）
# menuconfig 路径格式：LuCI → Applications → luci-app-xxx
# 修改配置：编辑 AX6-IPQ/.config，或运行 AX6-IPQ Config（可选 SSH menuconfig）


# =============================================================================
# 一、本固件已勾选（当前 AX6-IPQ/.config）
# =============================================================================

## LuCI 框架
LuCI ---> Collections ---> luci-light                    # 精简 LuCI 集合
LuCI ---> Collections ---> luci-ssl-openssl              # LuCI HTTPS（OpenSSL）

## Applications（已安装）
LuCI ---> Applications ---> luci-app-autoreboot          # 计划重启
LuCI ---> Applications ---> luci-app-ddns-go             # 动态域名（ddns-go）
LuCI ---> Applications ---> luci-app-firewall            # 防火墙（firewall4 / nftables）
LuCI ---> Applications ---> luci-app-package-manager     # 软件包管理（opkg）
LuCI ---> Applications ---> luci-app-passwall              # Passwall 代理（本固件唯一梯子前端）
LuCI ---> Applications ---> luci-app-ramfree               # 释放内存
LuCI ---> Applications ---> luci-app-uhttpd                # uHTTPd Web 服务器
LuCI ---> Applications ---> luci-app-upnp                  # UPnP 端口转发（miniupnpd-nftables）
LuCI ---> Applications ---> luci-app-vlmcsd                # KMS 激活服务
LuCI ---> Applications ---> luci-app-zerotier              # ZeroTier 组网

## Passwall 子选项（本固件已选）
LuCI ---> Applications ---> luci-app-passwall
    luci-app-passwall ---> Include Haproxy                 # 负载均衡
    luci-app-passwall ---> Include Sing-Box                # Sing-box 核心
    luci-app-passwall ---> Include V2ray Geoview           # Geo 规则查看（未预装 Geodata，需界面更新）
    luci-app-passwall ---> Include Xray                    # Xray 核心
    # 未勾选：V2ray_Geodata（Geo 数据不编入固件，首次使用请在规则管理里更新 GeoIP/GeoSite）

## Themes（主题）
LuCI ---> Themes ---> luci-theme-argon                   # Argon 主题
LuCI ---> Themes ---> luci-theme-bootstrap                 # Bootstrap 默认主题

## 相关系统包（非 LuCI，但配套启用）
Base system ---> zram-swap                               # ZRAM 交换分区


