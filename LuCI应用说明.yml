# =============================================================================
# 四、使用注意
# =============================================================================

# 1. NSS 加速
#    本固件面向 redmi_ax6-stock + NSS，防火墙中不要额外开启硬件/软件流量分载（flowoffload、sfe 等）。

# 2. 代理插件
#    本固件仅编入 Passwall（Xray + Sing-Box + Geoview）。
#    未编入 OpenClash；若自行勾选编译，也不要与 Passwall 同时运行。
#    首次使用请在 Passwall → 规则管理 中更新 GeoIP / GeoSite（未预装 Geodata 包）。

# 3. 包管理
#    本固件使用 opkg；在线安装插件优先用「系统 → 软件包」，自编译固件勿混用官方 kmod 源。

# 4. IPv6 支持（按需勾选）
Extra packages ---> ipv6helper                           # 勾选后相关依赖会自动带上
Network ---> odhcp6c
Network ---> odhcpd-ipv6only
LuCI ---> Protocols ---> luci-proto-ipv6
LuCI ---> Protocols ---> luci-proto-ppp

# 5. 配置变更流程
#    编辑 AX6-IPQ/.config，或运行 AX6-IPQ Config（会执行 make defconfig 同步上游依赖）
#    → 提交 .config → 运行 Build OpenWRT for AX6-NSS → Releases 下载固件
#    取消 LuCI 插件不会自动去掉 openvpn-openssl 等依赖包，需在 menuconfig 中手动取消。


